openapi: 3.0.0
info:
  title: CF Core Kit API
  description: Generated API contract (code-first).
  version: 0.0.0
  contact: {}
tags:
  - name: Health
    description: Service health and readiness endpoints.
  - name: Auth
    description: Authentication and session endpoints.
  - name: Users
    description: User profile endpoints.
servers:
  - url: /
components:
  schemas:
    AuthResultWithMeEnvelopeDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AuthResultWithMeDto"
      required:
        - data
    AuthResultWithMeDto:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/MeDto"
        accessToken:
          type: string
          example: <access-token>
        refreshToken:
          type: string
          example: <refresh-token>
      required:
        - user
        - accessToken
        - refreshToken
    MeDto:
      type: object
      properties:
        id:
          type: string
          example: 3d2c7b2a-2dd6-46a5-8f8e-3b5de8a5b0f0
        email:
          type: string
          example: user@example.com
        emailVerified:
          type: boolean
          example: false
        roles:
          type: array
          items:
            type: string
          example:
            - USER
        authMethods:
          type: array
          items:
            type: string
            enum:
              - PASSWORD
              - GOOGLE
          example:
            - PASSWORD
          description: Linked authentication methods on this account.
        profile:
          $ref: "#/components/schemas/MeProfileDto"
        accountDeletion:
          type: object
          nullable: true
          properties:
            requestedAt:
              type: string
              format: date-time
              example: 2026-01-10T12:34:56.789Z
            scheduledFor:
              type: string
              format: date-time
              example: 2026-02-09T12:34:56.789Z
          required:
            - requestedAt
            - scheduledFor
          description: When set, the account is scheduled for deletion. The request can be
            canceled until scheduledFor.
      required:
        - id
        - email
        - emailVerified
        - roles
        - authMethods
        - profile
    MeProfileDto:
      type: object
      properties:
        profileImageFileId:
          type: string
          nullable: true
          example: 3d2c7b2a-2dd6-46a5-8f8e-3b5de8a5b0f0
          description: Current profile image stored file ID. Use `GET
            /v1/me/profile-image/url` to get a short-lived URL for rendering.
        displayName:
          type: string
          nullable: true
          example: Dante
        givenName:
          type: string
          nullable: true
          example: Dante
        familyName:
          type: string
          nullable: true
          example: Alighieri
    OidcExchangeRequestDto:
      type: object
      properties:
        provider:
          type: string
          enum:
            - GOOGLE
          example: GOOGLE
        idToken:
          type: string
          example: <oidc-id-token>
        deviceId:
          type: string
          description: Stable per-device identifier (recommended).
        deviceName:
          type: string
          description: Human-friendly device name (optional).
      required:
        - provider
        - idToken
    OidcConnectRequestDto:
      type: object
      properties:
        provider:
          type: string
          enum:
            - GOOGLE
          example: GOOGLE
        idToken:
          type: string
          example: <oidc-id-token>
      required:
        - provider
        - idToken
    AuthResultEnvelopeDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AuthResultDto"
      required:
        - data
    AuthResultDto:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUserDto"
        accessToken:
          type: string
          example: <access-token>
        refreshToken:
          type: string
          example: <refresh-token>
      required:
        - user
        - accessToken
        - refreshToken
    AuthUserDto:
      type: object
      properties:
        id:
          type: string
          example: 3d2c7b2a-2dd6-46a5-8f8e-3b5de8a5b0f0
        email:
          type: string
          example: user@example.com
        emailVerified:
          type: boolean
          example: false
        authMethods:
          type: array
          items:
            type: string
            enum:
              - PASSWORD
              - GOOGLE
          example:
            - PASSWORD
            - GOOGLE
          description: Linked authentication methods on this account. Omitted on token
            refresh responses.
      required:
        - id
        - email
        - emailVerified
    RefreshRequestDto:
      type: object
      properties:
        refreshToken:
          type: string
          example: <refresh-token>
      required:
        - refreshToken
    LogoutRequestDto:
      type: object
      properties:
        refreshToken:
          type: string
          example: <refresh-token>
      required:
        - refreshToken
    VerifyEmailRequestDto:
      type: object
      properties:
        token:
          type: string
          example: <verification-token>
      required:
        - token
    MePushTokenUpsertRequestDto:
      type: object
      properties:
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
            - WEB
          example: ANDROID
          description: Client platform where the push token was minted.
        token:
          type: string
          maxLength: 2048
          example: <fcm-registration-token>
          description: FCM registration token for this device/app install.
      required:
        - platform
        - token
    ProfileImageUploadPlanEnvelopeDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ProfileImageUploadPlanDto"
      required:
        - data
    ProfileImageUploadPlanDto:
      type: object
      properties:
        fileId:
          type: string
          example: 3d2c7b2a-2dd6-46a5-8f8e-3b5de8a5b0f0
        upload:
          $ref: "#/components/schemas/PresignedUploadDto"
        expiresAt:
          type: string
          format: date-time
          example: 2026-01-10T12:34:56.789Z
      required:
        - fileId
        - upload
        - expiresAt
    PresignedUploadDto:
      type: object
      properties:
        method:
          type: string
          enum:
            - PUT
          example: PUT
        url:
          type: string
          example: https://<r2-presigned-url>
        headers:
          type: object
          properties: {}
          example:
            Content-Type: image/webp
          description: Headers that must be sent with the upload request.
      required:
        - method
        - url
        - headers
    CreateProfileImageUploadRequestDto:
      type: object
      properties:
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
          example: image/webp
          description: Declared MIME type for the upload. Must match the Content-Type used
            during upload.
        sizeBytes:
          type: number
          minimum: 1
          maximum: 5000000
          example: 123456
          description: Declared size of the upload in bytes (used to verify the stored
            object).
      required:
        - contentType
        - sizeBytes
    CompleteProfileImageUploadRequestDto:
      type: object
      properties:
        fileId:
          type: string
          example: 3d2c7b2a-2dd6-46a5-8f8e-3b5de8a5b0f0
      required:
        - fileId
    ProfileImageUrlEnvelopeDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ProfileImageUrlDto"
      required:
        - data
    ProfileImageUrlDto:
      type: object
      properties:
        url:
          type: string
          example: https://<r2-presigned-url>
        expiresAt:
          type: string
          format: date-time
          example: 2026-01-10T12:34:56.789Z
      required:
        - url
        - expiresAt
    MeEnvelopeDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/MeDto"
      required:
        - data
    PatchMeRequestDto:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/PatchMeProfileDto"
      required:
        - profile
    PatchMeProfileDto:
      type: object
      properties:
        displayName:
          type: string
          nullable: true
          minLength: 1
          maxLength: 100
          example: Dante
        givenName:
          type: string
          nullable: true
          minLength: 1
          maxLength: 100
          example: Dante
        familyName:
          type: string
          nullable: true
          minLength: 1
          maxLength: 100
          example: Alighieri
    MeSessionsListEnvelopeDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MeSessionDto"
        meta:
          $ref: "#/components/schemas/CursorPaginationMetaDto"
      required:
        - data
        - meta
    MeSessionDto:
      type: object
      properties:
        id:
          type: string
          example: 3d2c7b2a-2dd6-46a5-8f8e-3b5de8a5b0f0
        deviceId:
          type: string
          nullable: true
          example: device-a
        deviceName:
          type: string
          nullable: true
          example: iPhone 15
        ip:
          type: string
          nullable: true
          example: 203.0.113.10
        userAgent:
          type: string
          nullable: true
          maxLength: 512
          example: Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)
            AppleWebKit/605.1.15
        lastSeenAt:
          type: string
          format: date-time
          example: 2026-01-10T12:34:56.789Z
        createdAt:
          type: string
          format: date-time
          example: 2026-01-10T12:34:56.789Z
        expiresAt:
          type: string
          format: date-time
          example: 2026-02-10T12:34:56.789Z
        revokedAt:
          type: string
          nullable: true
          format: date-time
          example: 2026-01-10T12:34:56.789Z
        current:
          type: boolean
          example: true
        status:
          type: string
          enum:
            - active
            - revoked
            - expired
          example: active
      required:
        - id
        - lastSeenAt
        - createdAt
        - expiresAt
        - current
        - status
    CursorPaginationMetaDto:
      type: object
      properties:
        limit:
          type: number
          example: 25
        hasMore:
          type: boolean
          example: true
        nextCursor:
          type: string
          example: eyJ2IjoxLCJzb3J0IjoiLWNyZWF0ZWRBdCIsImFmdGVyIjp7fX0
      required:
        - limit
        - hasMore
  parameters: {}
  securitySchemes:
    access-token:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /health:
    get:
      operationId: health.get
      tags:
        - Health
      summary: Liveness check
      description: Indicates whether the process is alive.
      responses:
        "200":
          description: Liveness check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status
      x-error-codes:
        - INTERNAL
  /ready:
    get:
      operationId: ready.get
      tags:
        - Health
      summary: Readiness check
      description: Indicates whether the service is ready to receive traffic.
      responses:
        "200":
          description: Readiness check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status
      x-error-codes:
        - INTERNAL
  /v1/auth/oidc/exchange:
    post:
      operationId: auth.oidc.exchange
      tags:
        - Auth
      summary: Exchange OIDC id_token
      description: Verifies an OIDC id_token (e.g., Google) and issues first-party
        access + refresh tokens. Does not auto-link to an existing password
        account purely by email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcExchangeRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResultWithMeEnvelopeDto"
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_OIDC_NOT_CONFIGURED
        - AUTH_OIDC_TOKEN_INVALID
        - AUTH_OIDC_EMAIL_NOT_VERIFIED
        - AUTH_OIDC_LINK_REQUIRED
        - AUTH_USER_SUSPENDED
        - INTERNAL
  /v1/auth/oidc/connect:
    post:
      operationId: auth.oidc.connect
      tags:
        - Auth
      summary: Connect OIDC identity (current user)
      description: Links an OIDC identity (e.g., Google) to the authenticated user. If
        the OIDC email matches the user email, the user email is marked
        verified.
      security:
        - access-token: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
            description: Idempotency key for safe retries of write requests.
          required: false
          description: Idempotency key for safe retries of write requests.
          name: Idempotency-Key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcConnectRequestDto"
      responses:
        "204":
          description: ""
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - IDEMPOTENCY_IN_PROGRESS
        - CONFLICT
        - AUTH_OIDC_NOT_CONFIGURED
        - AUTH_OIDC_TOKEN_INVALID
        - AUTH_OIDC_EMAIL_NOT_VERIFIED
        - AUTH_OIDC_IDENTITY_ALREADY_LINKED
        - AUTH_OIDC_PROVIDER_ALREADY_LINKED
        - INTERNAL
  /v1/auth/refresh:
    post:
      operationId: auth.refresh
      tags:
        - Auth
      summary: Refresh tokens
      description: Rotates the refresh token and returns a new access + refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResultEnvelopeDto"
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_REFRESH_TOKEN_INVALID
        - AUTH_REFRESH_TOKEN_EXPIRED
        - AUTH_REFRESH_TOKEN_REUSED
        - AUTH_SESSION_REVOKED
        - AUTH_USER_SUSPENDED
        - INTERNAL
  /v1/auth/logout:
    post:
      operationId: auth.logout
      tags:
        - Auth
      summary: Logout
      description: Revokes the session associated with the provided refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequestDto"
      responses:
        "204":
          description: ""
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_REFRESH_TOKEN_INVALID
        - INTERNAL
  /v1/auth/email/verify:
    post:
      operationId: auth.email.verify
      tags:
        - Auth
      summary: Verify email
      description: Verifies a user email using a token sent via email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequestDto"
      responses:
        "204":
          description: ""
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_EMAIL_VERIFICATION_TOKEN_INVALID
        - AUTH_EMAIL_VERIFICATION_TOKEN_EXPIRED
        - INTERNAL
  /v1/auth/email/verification/resend:
    post:
      operationId: auth.email.verification.resend
      tags:
        - Auth
      summary: Resend verification email (current user)
      description: Sends a fresh email verification token to the authenticated user's
        email address. Callers can re-login afterwards to pick up the verified
        state.
      security:
        - access-token: []
      responses:
        "204":
          description: ""
      x-error-codes:
        - UNAUTHORIZED
        - RATE_LIMITED
        - INTERNAL
  /v1/me/push-token:
    put:
      operationId: users.me.pushToken.upsert
      tags:
        - Users
      summary: Register/update push token (current session)
      description: Stores the FCM registration token for the current session.
        Idempotent; replaces any existing token for the session.
      security:
        - access-token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MePushTokenUpsertRequestDto"
      responses:
        "204":
          description: ""
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - AUTH_PUSH_NOT_CONFIGURED
        - INTERNAL
    delete:
      operationId: users.me.pushToken.revoke
      tags:
        - Users
      summary: Revoke push token (current session)
      description: Clears the stored push token for the current session. Idempotent.
      security:
        - access-token: []
      responses:
        "204":
          description: ""
      x-error-codes:
        - UNAUTHORIZED
        - INTERNAL
  /.well-known/jwks.json:
    get:
      operationId: auth.jwks.get
      tags:
        - Auth
      summary: JWKS
      description: Publishes public keys used to verify access tokens.
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties: {}
                required:
                  - keys
      x-error-codes:
        - INTERNAL
  /v1/me/profile-image/upload:
    post:
      operationId: users.me.profileImage.upload
      tags:
        - Users
      summary: Create profile image upload plan
      description: Creates a stored-file record and returns a short-lived presigned
        PUT for the current user profile image.
      security:
        - access-token: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Idempotency key for safe retries of write requests. Replays return
              `Idempotency-Replayed: true`."
          required: false
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          name: Idempotency-Key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileImageUploadRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImageUploadPlanEnvelopeDto"
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - RATE_LIMITED
        - IDEMPOTENCY_IN_PROGRESS
        - CONFLICT
        - USERS_OBJECT_STORAGE_NOT_CONFIGURED
        - INTERNAL
  /v1/me/profile-image/complete:
    post:
      operationId: users.me.profileImage.complete
      tags:
        - Users
      summary: Complete profile image upload
      description: Verifies the uploaded object against the declared metadata and
        attaches it as the profile image.
      security:
        - access-token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteProfileImageUploadRequestDto"
      responses:
        "204":
          description: ""
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - NOT_FOUND
        - USERS_OBJECT_STORAGE_NOT_CONFIGURED
        - USERS_PROFILE_IMAGE_NOT_UPLOADED
        - USERS_PROFILE_IMAGE_SIZE_MISMATCH
        - USERS_PROFILE_IMAGE_CONTENT_TYPE_MISMATCH
        - INTERNAL
  /v1/me/profile-image:
    delete:
      operationId: users.me.profileImage.clear
      tags:
        - Users
      summary: Clear profile image
      description: Removes the current profile image and schedules object cleanup.
      security:
        - access-token: []
      responses:
        "204":
          description: ""
      x-error-codes:
        - UNAUTHORIZED
        - INTERNAL
  /v1/me/profile-image/url:
    get:
      operationId: users.me.profileImage.url
      tags:
        - Users
      summary: Get profile image URL
      description: Returns a short-lived presigned GET URL for the current profile
        image, or 204 when none is set.
      security:
        - access-token: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImageUrlEnvelopeDto"
        "204":
          description: ""
      x-error-codes:
        - UNAUTHORIZED
        - USERS_OBJECT_STORAGE_NOT_CONFIGURED
        - INTERNAL
  /v1/me/account-deletion/request:
    post:
      operationId: users.me.accountDeletion.request
      tags:
        - Users
      summary: Request account deletion
      description: Schedules the authenticated account for deletion after the grace
        period. Idempotent; repeated calls keep the original schedule.
      security:
        - access-token: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Idempotency key for safe retries of write requests. Replays return
              `Idempotency-Replayed: true`."
          required: false
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          name: Idempotency-Key
          in: header
      responses:
        "204":
          description: ""
      x-error-codes:
        - UNAUTHORIZED
        - IDEMPOTENCY_IN_PROGRESS
        - CONFLICT
        - USERS_CANNOT_DELETE_LAST_ADMIN
        - INTERNAL
  /v1/me/account-deletion/cancel:
    post:
      operationId: users.me.accountDeletion.cancel
      tags:
        - Users
      summary: Cancel account deletion
      description: Cancels a scheduled account deletion. Idempotent; calls without a
        pending deletion are no-ops.
      security:
        - access-token: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Idempotency key for safe retries of write requests. Replays return
              `Idempotency-Replayed: true`."
          required: false
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          name: Idempotency-Key
          in: header
      responses:
        "204":
          description: ""
      x-error-codes:
        - UNAUTHORIZED
        - IDEMPOTENCY_IN_PROGRESS
        - INTERNAL
  /v1/me:
    get:
      operationId: users.me.get
      tags:
        - Users
      summary: Get current user
      description: Returns the authenticated user profile.
      security:
        - access-token: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeEnvelopeDto"
      x-error-codes:
        - UNAUTHORIZED
        - INTERNAL
    patch:
      operationId: users.me.patch
      tags:
        - Users
      summary: Update current user profile
      description: Partially updates the authenticated user profile. Omitted fields
        are unchanged; null clears a field.
      security:
        - access-token: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Idempotency key for safe retries of write requests. Replays return
              `Idempotency-Replayed: true`."
          required: false
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          name: Idempotency-Key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMeRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeEnvelopeDto"
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - IDEMPOTENCY_IN_PROGRESS
        - CONFLICT
        - INTERNAL
  /v1/me/sessions:
    get:
      operationId: users.me.sessions.list
      tags:
        - Users
      summary: List current user sessions
      description: Lists all sessions (active, revoked, expired) for the authenticated
        user. Revoked sessions have refresh tokens revoked; access tokens remain
        valid until expiry.
      security:
        - access-token: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeSessionsListEnvelopeDto"
      parameters:
        - name: limit
          in: query
          required: false
